# ============================================================
#  Kubernetes Secret — AI Skill Defense Console
#
#  DO NOT commit real values.  Use one of:
#    make k8s-secrets          # auto-generates from .env
#    kubectl create secret ... # manual
#
#  All values must be base64-encoded:
#    echo -n "ACxxx..." | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-skill-defense-secrets
  namespace: default
  labels:
    app: ai-skill-defense
type: Opaque
stringData:
  # ---- App ----
  APP_API_KEY: ""

  # ---- Twilio ----
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
  TWILIO_TWIML_APP_SID: ""
  TWILIO_API_KEY: ""
  TWILIO_API_SECRET: ""

  # ---- Facebook Messenger ----
  FB_APP_ID: ""
  FB_APP_SECRET: ""
  FB_PAGE_ACCESS_TOKEN: ""
  FB_WEBHOOK_VERIFY_TOKEN: ""

  # ---- Public host (used in TwiML callback generation) ----
  PUBLIC_HOST: "https://your-domain.com"
  ALLOWED_ORIGINS: "https://your-domain.com"
