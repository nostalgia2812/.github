apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-skill-defense
spec:
  rules:
    - host: defense.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-skill-defense-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-skill-defense-frontend
                port:
                  number: 80
