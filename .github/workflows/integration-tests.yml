name: Integration Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'scripts/**'
      - '.tooling/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Wednesdays at 04:00 UTC
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - secret-scanning
          - network-security
          - web-testing
          - firmware-analysis
          - dev-frameworks

env:
  TOOLS_ROOT: /tmp/nostalgia2812-tools
  TEST_RESULTS_DIR: /tmp/test-results

jobs:
  # ─── Secret Scanning Integration Tests ────────────────────────────────────────
  test-secret-scanning:
    name: Test Secret Scanning Tools
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.test_suite == '' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'secret-scanning'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@latest
          echo "Gitleaks version: $(gitleaks version)"

      - name: Install TruffleHog
        run: |
          go install github.com/trufflesecurity/trufflehog/v3@latest
          echo "TruffleHog version: $(trufflehog --version)"

      - name: Create test repository with synthetic secrets
        run: |
          mkdir -p /tmp/test-repo
          cd /tmp/test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a file with a fake AWS key (for testing detection)
          cat > test-secrets.txt << 'SECRETS'
          # This is a test file with synthetic/fake credentials for tool validation
          # DO NOT USE THESE - they are intentionally fake for testing
          FAKE_AWS_KEY=AKIAIOSFODNN7EXAMPLE1
          FAKE_DB_PASS=fake_password_for_testing_only_not_real
          FAKE_API_TOKEN=fake_token_abc123def456_testing_only
          SECRETS

          git add test-secrets.txt
          git commit -m "Add test file with synthetic secrets"

      - name: Test Gitleaks detection
        run: |
          cd /tmp/test-repo
          echo "Running Gitleaks on test repository..."
          gitleaks detect --source . --verbose --redact --no-git 2>&1 || true
          echo "✓ Gitleaks secret detection test complete"

      - name: Test TruffleHog detection
        run: |
          cd /tmp/test-repo
          echo "Running TruffleHog on test repository..."
          trufflehog git file://. --no-update 2>&1 | head -50 || true
          echo "✓ TruffleHog detection test complete"

      - name: Test pre-commit configuration
        run: |
          pip install pre-commit
          cd /tmp/test-repo
          cat > .pre-commit-config.yaml << 'PRECOMMIT'
          repos:
            - repo: https://github.com/gitleaks/gitleaks
              rev: v8.18.0
              hooks:
                - id: gitleaks
          PRECOMMIT
          pre-commit run --all-files 2>&1 || true
          echo "✓ Pre-commit configuration test complete"

      - name: Save test results
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          cat > "$TEST_RESULTS_DIR/secret-scanning.json" << EOF
          {
            "suite": "secret-scanning",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tools": {
              "gitleaks": {
                "version": "$(gitleaks version 2>/dev/null || echo 'unknown')",
                "status": "installed"
              },
              "trufflehog": {
                "version": "$(trufflehog --version 2>/dev/null || echo 'unknown')",
                "status": "installed"
              }
            }
          }
          EOF

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scanning-results
          path: ${{ env.TEST_RESULTS_DIR }}

  # ─── Firmware Analysis Integration Tests ──────────────────────────────────────
  test-firmware-analysis:
    name: Test Firmware Analysis Tools
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.test_suite == '' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'firmware-analysis'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for unblob
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lzop zstd liblzo2-dev build-essential \
            libmagic1 squashfs-tools p7zip-full unar

      - name: Install unblob
        run: |
          pip install unblob
          unblob --version
          echo "✓ unblob installed"

      - name: Create test binary
        run: |
          mkdir -p /tmp/firmware-test
          # Create a small gzip-compressed test file
          echo "Test firmware content for unblob validation" | gzip > /tmp/firmware-test/test.gz
          echo "✓ Test binary created"

      - name: Test unblob extraction
        run: |
          mkdir -p /tmp/unblob-output
          cd /tmp/firmware-test
          unblob -e /tmp/unblob-output test.gz && \
            echo "✓ unblob extraction successful" || \
            echo "⚠ unblob extraction completed with warnings"

          ls -la /tmp/unblob-output/ || true

      - name: Verify extraction output
        run: |
          if [[ -d /tmp/unblob-output ]]; then
            echo "✓ Output directory created"
            find /tmp/unblob-output -type f | head -20
          else
            echo "⚠ No output directory created"
          fi

  # ─── Development Framework Tests ──────────────────────────────────────────────
  test-dev-frameworks:
    name: Test Development Frameworks
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.test_suite == '' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'dev-frameworks'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test ADK Python installation
        run: |
          pip install google-adk 2>/dev/null || pip install google-adk --pre 2>/dev/null || true
          python3 -c "
          try:
              import google.adk
              print('✓ google-adk importable')
          except ImportError as e:
              print(f'⚠ google-adk import: {e}')
          " || true
          pip show google-adk 2>/dev/null && echo "✓ google-adk package installed" || echo "⚠ google-adk not installed"

      - name: Test Firebase tools installation
        run: |
          npm install -g firebase-tools 2>/dev/null || true
          firebase --version && echo "✓ Firebase CLI installed" || echo "⚠ Firebase CLI not installed"

      - name: Validate tool manifest schema for dev tools
        run: |
          python3 << 'EOF'
          import json

          with open('.tooling/tool_manifest.json') as f:
              manifest = json.load(f)

          dev_tools = [t for t in manifest['tools'] if t['category'] == 'development-frameworks']
          print(f"Found {len(dev_tools)} development framework tools:")
          for tool in dev_tools:
              print(f"  ✓ {tool['name']} ({tool['language']})")
          EOF

  # ─── Tool Catalog Integration ─────────────────────────────────────────────────
  test-catalog-integration:
    name: Test Tool Catalog Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cross-validate manifest, categories, and index
        run: |
          python3 << 'EOF'
          import json, re, sys

          # Load all data sources
          with open('.tooling/tool_manifest.json') as f:
              manifest = json.load(f)
          with open('.tooling/categories.json') as f:
              categories = json.load(f)
          with open('TOOLS_INDEX.md') as f:
              index = f.read()

          tools = manifest['tools']
          cats = categories['categories']
          errors = []
          warnings = []

          # All tool IDs from manifest
          tool_ids = {t['id'] for t in tools}

          # All tools referenced in categories
          cat_tool_refs = set()
          for cat in cats:
              cat_tool_refs.update(cat.get('tools', []))
              for subcat in cat.get('subcategories', []):
                  cat_tool_refs.update(subcat.get('tools', []))

          # Check: All manifest tools are in categories
          for tool_id in tool_ids:
              if tool_id not in cat_tool_refs:
                  warnings.append(f"Tool '{tool_id}' in manifest but not in any category")

          # Check: All category tool refs exist in manifest
          for tool_id in cat_tool_refs:
              if tool_id not in tool_ids:
                  errors.append(f"Category references non-existent tool: '{tool_id}'")

          # Check: All tools are in TOOLS_INDEX.md
          for tool in tools:
              if tool['name'] not in index and tool['id'] not in index:
                  warnings.append(f"Tool '{tool['id']}' may not be in TOOLS_INDEX.md")

          # Check: Category consistency
          manifest_categories = {t['category'] for t in tools}
          cat_ids = {c['id'] for c in cats}
          for cat in manifest_categories:
              if cat not in cat_ids:
                  errors.append(f"Category '{cat}' in manifest not defined in categories.json")

          if errors:
              print("ERRORS:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)

          if warnings:
              print("WARNINGS:")
              for w in warnings:
                  print(f"  ⚠ {w}")

          print(f"\n✓ Catalog integration check passed:")
          print(f"  - {len(tools)} tools in manifest")
          print(f"  - {len(cats)} categories defined")
          print(f"  - {len(cat_tool_refs)} tool references in categories")
          EOF

      - name: Generate integration test report
        if: always()
        run: |
          python3 << 'EOF'
          import json

          with open('.tooling/tool_manifest.json') as f:
              manifest = json.load(f)

          with open('.tooling/categories.json') as f:
              categories = json.load(f)

          report = {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "total_tools": len(manifest['tools']),
              "total_categories": len(categories['categories']),
              "tools_by_category": {}
          }

          for tool in manifest['tools']:
              cat = tool['category']
              if cat not in report['tools_by_category']:
                  report['tools_by_category'][cat] = []
              report['tools_by_category'][cat].append(tool['id'])

          print(json.dumps(report, indent=2))
          EOF

  # ─── Integration Test Summary ─────────────────────────────────────────────────
  integration-summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [test-secret-scanning, test-firmware-analysis, test-dev-frameworks, test-catalog-integration]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.test-secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firmware Analysis | ${{ needs.test-firmware-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Development Frameworks | ${{ needs.test-dev-frameworks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Catalog Integration | ${{ needs.test-catalog-integration.result }} |" >> $GITHUB_STEP_SUMMARY
