name: Security Scan

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly comprehensive scan on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ─── Secret Scanning with Gitleaks ────────────────────────────────────────────
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for complete scanning

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Run Gitleaks (fallback)
        if: always()
        run: |
          docker run --rm -v "$(pwd):/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --verbose --redact \
            --report-format sarif --report-path /repo/gitleaks-report.sarif || true

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

  # ─── Secret Scanning with TruffleHog ──────────────────────────────────────────
  trufflehog-scan:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: TruffleHog Full History Scan (scheduled)
        if: github.event_name == 'schedule'
        run: |
          docker run --rm -v "$(pwd):/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo --only-verified --json > trufflehog-results.json 2>/dev/null || true

          if [[ -s trufflehog-results.json ]]; then
            echo "⚠️ TruffleHog found potential secrets:"
            cat trufflehog-results.json
          else
            echo "✓ No verified secrets found by TruffleHog"
          fi

  # ─── Dependency Vulnerability Scanning ────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install safety
        run: pip install safety

      - name: Scan Python dependencies
        run: |
          find . -name "requirements*.txt" -not -path "./.git/*" | while read req; do
            echo "Scanning: $req"
            safety check -r "$req" --json > safety-report.json 2>/dev/null || {
              echo "Vulnerabilities found in $req:"
              safety check -r "$req" || true
            }
          done

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  # ─── Static Analysis ──────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell scripts
        run: |
          FAILED=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            shellcheck --severity=error "$script" || FAILED=1
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

          if [[ $FAILED -eq 1 ]]; then
            echo "ShellCheck found errors"
            exit 1
          fi
          echo "✓ All shell scripts passed ShellCheck"

      - name: Validate JSON files
        run: |
          FAILED=0
          while IFS= read -r -d '' json_file; do
            echo "Validating: $json_file"
            python3 -m json.tool "$json_file" > /dev/null || {
              echo "Invalid JSON: $json_file"
              FAILED=1
            }
          done < <(find . -name "*.json" -not -path "./.git/*" -print0)

          if [[ $FAILED -eq 1 ]]; then
            echo "JSON validation failed"
            exit 1
          fi
          echo "✓ All JSON files are valid"

      - name: Validate YAML files
        run: |
          pip install pyyaml
          FAILED=0
          while IFS= read -r -d '' yaml_file; do
            echo "Validating: $yaml_file"
            python3 -c "import yaml; yaml.safe_load(open('$yaml_file'))" || {
              echo "Invalid YAML: $yaml_file"
              FAILED=1
            }
          done < <(find . \( -name "*.yml" -o -name "*.yaml" \) -not -path "./.git/*" -print0)

          if [[ $FAILED -eq 1 ]]; then
            echo "YAML validation failed"
            exit 1
          fi
          echo "✓ All YAML files are valid"

  # ─── Supply Chain Security ────────────────────────────────────────────────────
  supply-chain:
    name: Supply Chain Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tool manifest integrity
        run: |
          python3 << 'EOF'
          import json, sys, hashlib

          # Load manifest
          with open('.tooling/tool_manifest.json') as f:
              manifest = json.load(f)

          # Verify required security fields
          required_fields = ['id', 'name', 'repository', 'category', 'license']
          issues = []

          for tool in manifest['tools']:
              for field in required_fields:
                  if field not in tool:
                      issues.append(f"Tool '{tool.get('id')}' missing '{field}'")

              # Check for license info
              license_val = tool.get('license', '')
              if not license_val or license_val == 'unknown':
                  issues.append(f"Tool '{tool.get('id')}' has unknown/missing license")

          if issues:
              print("Supply chain issues found:")
              for issue in issues:
                  print(f"  - {issue}")
              sys.exit(1)
          else:
              print(f"✓ Supply chain verification passed for {len(manifest['tools'])} tools")
          EOF

      - name: Check for pinned actions
        run: |
          echo "Checking GitHub Actions workflow files for pinned versions..."
          # Check that actions use specific versions (not just 'latest')
          grep -r "uses:" .github/workflows/ | grep -v "@v[0-9]" | grep -v "#" | \
            grep -v "uses: docker://" | \
            head -20 || echo "✓ All actions appear to use pinned versions"

  # ─── Security Report ──────────────────────────────────────────────────────────
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan, dependency-scan, static-analysis, supply-chain]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks Secret Scan | ${{ needs.gitleaks-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog Deep Scan | ${{ needs.trufflehog-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain Check | ${{ needs.supply-chain.result }} |" >> $GITHUB_STEP_SUMMARY
