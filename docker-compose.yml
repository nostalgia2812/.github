version: '3.9'

services:

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - APP_API_KEY=${APP_API_KEY:-}
      - FLUID_API_KEY=${FLUID_API_KEY:-}
      - FLUID_BASE_URL=${FLUID_BASE_URL:-https://api.fluid.security/v1}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
